name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: flox/install-flox-action@61d86f71ca9fc8061fea04e5bc5e3a8206423dca # v2
      - name: Install locked dependencies
        run: flox activate -- bash -c 'bun install --frozen-lockfile && bun install --cwd site --frozen-lockfile'
      - name: Run native validator (pre-commit parity)
        run: flox activate -- scripts/validate.sh --all
